name: CI - Python Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"

      - name: Lint Version Strings
        run: uv run scripts/check_versions.py

      - name: Run Unit Tests
        run: |
          uv run --with pandas --with python-dotenv --with pytest --with pytest-cov pytest -v --cov=scripts --cov-report=term-missing tests/

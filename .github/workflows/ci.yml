name: CI - Python Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/zip
          unzip -q ffmpeg.zip
          sudo mv ffmpeg /usr/local/bin/
          curl -sL -o ffprobe.zip https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip
          unzip -q ffprobe.zip
          sudo mv ffprobe /usr/local/bin/

      - name: Set up FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Run Unit Tests
        run: |
          uv run --with pandas --with pytest --with pytest-cov pytest -v --cov=scripts --cov-report=term-missing tests/
